name: Ajusta paleta do laboratório

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ajusta-paleta-laboratorio.yml

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar cores do laboratório ao cabeçalho e rodapé
        shell: python
        run: |
          from pathlib import Path

          caminho = Path("guias/o-que-vem-por-ai.html")
          html = caminho.read_text(encoding="utf-8")

          cabecalho_atual = '.site-header{background:linear-gradient(135deg,var(--green-950),var(--green-700));color:#fff;border-bottom:5px solid #7ebc8d}'
          cabecalho_novo = '.site-header{background:linear-gradient(120deg,#151f39 0%,#26375f 52%,#6d55c7 100%);color:#fff;border-bottom:5px solid #1b8f8a;box-shadow:0 8px 24px rgba(24,35,63,.18)}'

          rodape_atual = '.site-footer{background:var(--green-950);color:#eaf4ee;padding:2rem 0}'
          rodape_novo = '.site-footer{background:linear-gradient(135deg,#10182d 0%,#18233f 55%,#352b67 100%);color:#edf0ff;padding:2rem 0;border-top:4px solid #1b8f8a}'

          assert html.count(cabecalho_atual) == 1
          assert html.count(rodape_atual) == 1

          html = html.replace(cabecalho_atual, cabecalho_novo, 1)
          html = html.replace(rodape_atual, rodape_novo, 1)

          assert html.count(cabecalho_novo) == 1
          assert html.count(rodape_novo) == 1
          caminho.write_text(html, encoding="utf-8")

      - name: Publicar e remover o fluxo temporário
        run: |
          git config user.name "cca-bat"
          git config user.email "cca-bat@users.noreply.github.com"
          git rm .github/workflows/ajusta-paleta-laboratorio.yml
          git add guias/o-que-vem-por-ai.html
          git commit -m "Integra cabeçalho e rodapé à paleta do laboratório"
          git push origin HEAD:main
