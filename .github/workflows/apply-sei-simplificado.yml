name: Aplicar simplificacao do cadastro SEI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-sei-simplificado.yml

permissions:
  contents: write

concurrency:
  group: aplicar-sei-simplificado
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a arvore atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar pagina e imagem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guias/assets/sei/media
          base64 -d .hotfix/sei-page.b64 | gzip -dc > guias/sei-cadastro-inicial.html
          cat .hotfix/sei-image-1.b64 .hotfix/sei-image-2.b64 .hotfix/sei-image-3.b64 | base64 -d > guias/assets/sei/media/suap-chamado-preenchimento.jpg
          rm -rf .hotfix
          rm -f .github/workflows/apply-sei-simplificado.yml

      - name: Validar alteracoes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          page = Path('guias/sei-cadastro-inicial.html').read_text(encoding='utf-8')
          required = [
              'https://suap.ifce.edu.br/centralservicos/abrir_chamado/317/',
              'o e-mail automático serve apenas como confirmação',
              'Não é necessário anexar documentos',
              'suap-chamado-preenchimento.jpg',
              'suapedu-primeiro-acesso.html#recuperacao',
          ]
          lower = page.lower()
          for item in required:
              assert item.lower() in lower, item
          assert 'tutorial-email-link-suap' not in page
          assert 'tutorial-central-servicos-sei' not in page
          assert 'Existem 15 chamados abertos' not in page
          image = Path('guias/assets/sei/media/suap-chamado-preenchimento.jpg')
          assert image.stat().st_size > 20000
          assert image.read_bytes()[:3] == b'\xff\xd8\xff'
          print('OK: fluxo simplificado e imagem validados')
          PY

      - name: Publicar alteracao limpa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          echo "$changed" | grep -qx 'guias/sei-cadastro-inicial.html'
          echo "$changed" | grep -qx 'guias/assets/sei/media/suap-chamado-preenchimento.jpg'
          test -z "$(echo "$changed" | grep -Ev '^(guias/sei-cadastro-inicial.html|guias/assets/sei/media/suap-chamado-preenchimento.jpg|\.hotfix/.*|\.github/workflows/apply-sei-simplificado.yml)$')"
          git commit -m "Simplifica abertura do chamado de acesso ao SEI"
          git push origin HEAD:main
