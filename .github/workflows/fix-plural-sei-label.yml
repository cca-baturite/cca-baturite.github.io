name: Ajustar plural e rótulo do SEI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-plural-sei-label.yml

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a árvore atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar e validar os textos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          root = Path('.').resolve()
          index_path = root / 'guias/index.html'
          sei_path = root / 'guias/sei.html'
          search_path = root / 'guias/assets/busca.json'

          index = index_path.read_text(encoding='utf-8')
          sei = sei_path.read_text(encoding='utf-8')
          search_text = search_path.read_text(encoding='utf-8')

          singular = 'Guia da CCA - IFCE Baturité'
          plural = 'Guias da CCA - IFCE Baturité'
          assert index.count(singular) == 4, index.count(singular)
          index = index.replace(singular, plural)

          old_label = 'Problemas para entrar ou usar o SEI'
          new_label = 'Problemas para entrar no SEI'
          assert index.count(old_label) == 1, index.count(old_label)
          assert sei.count(old_label) == 2, sei.count(old_label)
          assert search_text.count(old_label) == 1, search_text.count(old_label)
          index = index.replace(old_label, new_label)
          sei = sei.replace(old_label, new_label)
          search_text = search_text.replace(old_label, new_label)

          data = json.loads(search_text)
          matches = [item for item in data if item.get('t') == new_label]
          assert len(matches) == 1
          assert matches[0]['u'] == 'sei.html#problemas-de-acesso'

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'):
                      self.ids.append(attrs['id'])

          for content, label in ((index, 'index'), (sei, 'sei')):
              parser = Parser()
              parser.feed(content)
              assert len(parser.ids) == len(set(parser.ids)), label

          assert singular not in index
          assert old_label not in index
          assert old_label not in sei
          assert old_label not in search_text
          assert index.count(plural) == 4

          index_path.write_text(index, encoding='utf-8')
          sei_path.write_text(sei, encoding='utf-8')
          search_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('OK: plural e rótulo do SEI ajustados')
          PY

      - name: Publicar alteração limpa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-plural-sei-label.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          echo "$changed" | grep -qx 'guias/index.html'
          echo "$changed" | grep -qx 'guias/sei.html'
          echo "$changed" | grep -qx 'guias/assets/busca.json'
          test -z "$(echo "$changed" | grep -Ev '^(guias/index.html|guias/sei.html|guias/assets/busca.json|\.github/workflows/fix-plural-sei-label.yml)$')"
          git commit -m "Ajusta título e rótulo de acesso ao SEI"
          git push origin HEAD:main
