name: Corrigir numeração dos índices do SEI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sei-toc-numbering.yml

permissions:
  contents: write

concurrency:
  group: corrigir-indices-sei
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a árvore atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reorganizar e validar os índices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          pages = {
              Path('guias/sei-abrir-solicitacao-computador.html'): {
                  'steps': [
                      ('entrar', 'Entrar no SEI'),
                      ('processo-novo', 'Abrir processo novo'),
                      ('tipo-processo', 'Escolher o tipo'),
                      ('dados-iniciais', 'Nome e cidade'),
                      ('requerimento', 'Requerimento Geral'),
                      ('salvar-fechar', 'Salvar e fechar'),
                      ('nivel-principal', 'Nível de acesso'),
                      ('anexos', 'Verificar anexos'),
                      ('adicionar-documento', 'Adicionar documentos'),
                      ('peticionar', 'Peticionar e assinar'),
                  ],
                  'after': [
                      ('conferencia', 'Conferência final'),
                      ('problemas', 'Problemas comuns'),
                      ('acessar-sei', 'Acessar o SEI'),
                  ],
              },
              Path('guias/sei-abrir-solicitacao-celular.html'): {
                  'steps': [
                      ('login', 'Entrar no SEI'),
                      ('processo-novo', 'Abrir processo novo'),
                      ('tipo-processo', 'Escolher o tipo'),
                      ('dados-iniciais', 'Dados iniciais'),
                      ('requerimento', 'Documento principal'),
                      ('salvar-voltar', 'Guias do navegador'),
                      ('acesso-principal', 'Nível de acesso'),
                      ('anexos', 'Verificar anexos'),
                      ('adicionar-documento', 'Adicionar documentos'),
                      ('peticionar', 'Peticionar e assinar'),
                  ],
                  'after': [
                      ('conferencia-final', 'Conferência final'),
                      ('problemas', 'Problemas comuns'),
                      ('acessar-sei', 'Acessar o SEI'),
                  ],
              },
          }

          phase_items = [
              ('guia-fase-1', 'Fase 1 — Prepare e acesse'),
              ('guia-fase-2', 'Fase 2 — Abra e preencha'),
              ('guia-fase-3', 'Fase 3 — Anexe os documentos'),
              ('guia-fase-4', 'Fase 4 — Peticione e conclua'),
          ]

          css = '''<style id="cca-toc-groups">
          .toc .toc-group{margin-top:.85rem}
          .toc .toc-group:first-of-type{margin-top:.55rem}
          .toc .toc-group-title{display:block;margin-bottom:.35rem;color:var(--green-900);font-size:.86rem;font-weight:850;letter-spacing:.045em;text-transform:uppercase}
          .toc .toc-link-standalone{display:block;margin:.45rem 0;text-decoration:none}
          .toc .toc-step-list{margin:.35rem 0 0;padding-left:1.45rem}
          .toc .toc-plain-list{list-style:none;margin:.35rem 0 0;padding-left:0}
          .toc .toc-plain-list li{margin:.38rem 0}
          </style>'''

          def links(items, ordered):
              tag = 'ol' if ordered else 'ul'
              cls = 'toc-step-list' if ordered else 'toc-plain-list'
              body = ''.join(f'<li><a href="#{anchor}">{label}</a></li>' for anchor, label in items)
              return f'<{tag} class="{cls}">{body}</{tag}>'

          def build_toc(config):
              return (
                  '<aside aria-label="Nesta página" class="toc">'
                  '<strong>Nesta página</strong>'
                  '<div class="toc-group"><span class="toc-group-title">Fases do guia</span>'
                  + links(phase_items, False) + '</div>'
                  '<div class="toc-group"><a class="toc-link-standalone" href="#antes">Antes de começar</a></div>'
                  '<div class="toc-group"><span class="toc-group-title">Passos</span>'
                  + links(config['steps'], True) + '</div>'
                  '<div class="toc-group"><span class="toc-group-title">Depois dos passos</span>'
                  + links(config['after'], False) + '</div>'
                  '</aside>'
              )

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'):
                      self.ids.append(attrs['id'])

          for path, config in pages.items():
              text = path.read_text(encoding='utf-8')
              before_images = re.findall(r'<img\b[^>]*>', text, flags=re.I)

              numbers = [int(n) for n in re.findall(r'<span class="step-number[^>]*">\s*(\d+)\s*</span>', text)]
              assert numbers == list(range(1, 11)), f'Numeração dos passos inesperada em {path}: {numbers}'

              parser = IdParser()
              parser.feed(text)
              ids = set(parser.ids)
              required = {'antes', *(a for a, _ in phase_items), *(a for a, _ in config['steps']), *(a for a, _ in config['after'])}
              missing = sorted(required - ids)
              assert not missing, f'Âncoras ausentes em {path}: {missing}'

              pattern = r'<aside aria-label="Nesta página" class="toc">.*?</aside>'
              matches = re.findall(pattern, text, flags=re.S)
              assert len(matches) == 1, f'Índice lateral inesperado em {path}: {len(matches)}'
              text = re.sub(pattern, build_toc(config), text, count=1, flags=re.S)

              if 'id="cca-toc-groups"' not in text:
                  assert text.count('</head>') == 1, f'Fechamento de head inesperado em {path}'
                  text = text.replace('</head>', css + '</head>', 1)

              assert text.count('class="toc-step-list"') == 1
              assert text.count('class="toc-plain-list"') == 2
              assert text.count('class="toc-link-standalone"') == 1
              assert text.count('href="#antes"') >= 1
              assert all(f'href="#{a}"' in text for a, _ in config['steps'])
              assert re.findall(r'<img\b[^>]*>', text, flags=re.I) == before_images, f'Imagens alteradas em {path}'
              path.write_text(text, encoding='utf-8')

          print('OK: índices de celular e computador reorganizados sem alterar imagens')
          PY

      - name: Publicar correção limpa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-sei-toc-numbering.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          echo "$changed" | grep -qx 'guias/sei-abrir-solicitacao-celular.html'
          echo "$changed" | grep -qx 'guias/sei-abrir-solicitacao-computador.html'
          test -z "$(echo "$changed" | grep -Ev '^(guias/sei-abrir-solicitacao-celular.html|guias/sei-abrir-solicitacao-computador.html|\.github/workflows/fix-sei-toc-numbering.yml)$')"
          git commit -m "Corrige numeração dos índices dos guias do SEI"
          git push origin HEAD:main
