name: Adiciona O que vem por aí

on: [push]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Criar card e página
        shell: python
        run: |
          from pathlib import Path

          path = Path("guias/index.html")
          html = path.read_text(encoding="utf-8")
          marker = '<article class="system-card"><span class="badge">Guias disponíveis</span><h2>SuapEdu</h2><p>Primeiro acesso e mapa inicial das funções acadêmicas para os ingressantes matriculados no SUAP.</p><div class="hero-actions"><a class="button button-primary" href="suapedu.html">Conhecer o SuapEdu</a><a class="button button-secondary" href="suapedu-primeiro-acesso.html">Primeiro acesso</a><a class="button button-secondary" href="suapedu-principais-funcoes.html">Principais funções</a><a class="button button-secondary" href="suapedu-email.html">E-mail institucional</a><a class="button button-secondary" href="suapedu-principais-funcoes.html#documentos">Emitir documentos</a></div><details class="q-documents-preview"><summary>Ver documentos disponíveis</summary><p>Declaração de Vínculo, Histórico Parcial, Declaração de Carga Horária Integralizada, Declaração de Matrícula, Declaração de Matrícula com disciplinas cursando e Comprovante de Dados Acadêmicos. As opções podem variar conforme o vínculo acadêmico.</p></details></article>'
          card = '\n<article class="system-card"><span class="badge">Em breve</span><h2>O que vem por aí</h2><p>Novos guias, páginas específicas e ferramentas de apoio acadêmico estão em preparação.</p><div class="hero-actions"><a class="button button-primary" href="o-que-vem-por-ai.html">Ver novidades</a></div></article>'
          assert html.count(marker) == 1
          assert 'o-que-vem-por-ai.html' not in html
          html = html.replace(marker, marker + card, 1)
          path.write_text(html, encoding="utf-8")

          head = html.split('</head>', 1)[0] + '</head>'
          head = head.replace('<title>Guias da CCA - IFCE Baturité</title>', '<title>O que vem por aí | Guias da CCA</title>', 1)
          head = head.replace('Portal de orientações da Coordenadoria de Controle Acadêmico do IFCE Campus Baturité.', 'Próximos guias, páginas específicas, vídeos e ferramentas previstos para o Portal de Guias da CCA.')
          head = head.replace('<meta content="Guias da CCA - IFCE Baturité" property="og:title"/>', '<meta content="O que vem por aí | Guias da CCA" property="og:title"/>', 1)
          head = head.replace('<meta content="https://cca-baturite.github.io/guias/" property="og:url"/>', '<meta content="https://cca-baturite.github.io/guias/o-que-vem-por-ai.html" property="og:url"/>', 1)

          hs = html.index('<header class="site-header">')
          he = html.index('</header>', hs) + len('</header>')
          header = html[hs:he].replace(' aria-current="page"', '', 1)
          fs = html.index('<footer class="site-footer">')
          fe = html.index('</footer>', fs) + len('</footer>')
          footer = html[fs:fe]

          main = '''<body><a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
{header}<main class="page-shell" id="conteudo">
<nav aria-label="Caminho da página" class="breadcrumb"><ol><li><a href="index.html">Guias</a></li><li aria-current="page">O que vem por aí</li></ol></nav>
<section class="hero"><p class="eyebrow">Próximos conteúdos</p><h1>O que vem por aí</h1><p class="lead">Veja os próximos guias, páginas específicas e ferramentas previstos para ampliar o Portal de Guias da CCA. Enquanto eles não são publicados, continue utilizando as orientações já disponíveis.</p><div class="hero-actions"><a class="button button-primary" href="index.html">Voltar ao início</a></div></section>
<div class="content-layout"><article class="article">
<section class="article-section"><div class="callout info"><div class="callout-title">Página temporária</div><p>À medida que cada conteúdo for publicado, ele será transferido para a área correspondente do portal e deixará esta lista.</p></div></section>
<section class="article-section" id="paginas-especificas"><p class="eyebrow">Páginas específicas em preparação</p><h2>Orientações mais diretas para cada procedimento</h2><div class="cards" style="padding-bottom:0">
<article class="guide-card"><span class="badge">Enquanto isso</span><h2>Procedimentos específicos do SEI</h2><p>Páginas dedicadas para solicitações acadêmicas específicas, com orientações mais diretas para cada caso. Por enquanto, use os guias gerais de abertura de processo.</p><div class="hero-actions"><a class="button button-primary" href="sei-abrir-solicitacao-celular.html">Guia pelo celular</a><a class="button button-secondary" href="sei-abrir-solicitacao-computador.html">Guia pelo computador</a></div></article>
<article class="guide-card"><span class="badge">Em breve</span><h2>Colação de grau, diplomas e certificados</h2><p>Uma página específica para orientar as etapas de conclusão do curso e a emissão dos documentos correspondentes.</p></article>
<article class="guide-card"><span class="badge">Em breve</span><h2>Retorno ao curso</h2><p>Orientações específicas para estudantes com matrícula trancada ou em situação de abandono que desejam retomar o curso.</p></article>
<article class="guide-card"><span class="badge">Em breve</span><h2>Atualização de dados cadastrais no IFCE</h2><p>Orientações para conferir, corrigir ou atualizar informações pessoais e acadêmicas nos sistemas institucionais.</p></article>
<article class="guide-card"><span class="badge">Em breve</span><h2>Quando procurar cada setor do Departamento de Ensino</h2><p>Um guia para diferenciar as atribuições da Coordenação de Curso, da CTP, da CAE e do próprio Departamento de Ensino.</p></article>
</div></section>
<section class="article-section" id="ferramentas"><p class="eyebrow">Ferramentas de apoio acadêmico</p><h2>Recursos para compreender e planejar o percurso curricular</h2><div class="cards" style="padding-bottom:0">
<article class="guide-card"><span class="badge">Em breve</span><h2>Como entender uma matriz curricular</h2><p>Uma explicação simples sobre períodos, códigos, carga horária, pré-requisitos, equivalências e situação da matriz.</p></article>
<article class="guide-card"><span class="badge">Em breve</span><h2>Busca inteligente e calculadora curricular</h2><p>Uma ferramenta para consultar disciplinas, pré-requisitos e equivalências e compreender melhor as possibilidades do percurso acadêmico.</p></article>
</div></section>
<section class="article-section" id="videos"><p class="eyebrow">Conteúdos em vídeo</p><h2>Guias em vídeo</h2><div class="guide-card"><span class="badge">Em breve</span><p>Orientações em vídeo serão adicionadas gradualmente para complementar os guias escritos.</p></div></section>
</article><aside aria-label="Nesta página" class="toc"><h2>Nesta página</h2><ol><li><a href="#paginas-especificas">Páginas específicas</a></li><li><a href="#ferramentas">Ferramentas de apoio acadêmico</a></li><li><a href="#videos">Guias em vídeo</a></li></ol></aside></div>
</main>{footer}<script data-goatcounter="https://cca-baturite.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body></html>'''.format(header=header, footer=footer)

          page = head + main
          out = Path('guias/o-que-vem-por-ai.html')
          assert not out.exists()
          out.write_text(page, encoding='utf-8')
          assert 'Dados cadastrais dos estudantes' not in page
          assert 'Atualização de dados cadastrais no IFCE' in page

      - name: Publicar e remover fluxo temporário
        run: |
          git config user.name "cca-bat"
          git config user.email "cca-bat@users.noreply.github.com"
          git rm .github/workflows/adiciona-o-que-vem-por-ai.yml
          git add guias/index.html guias/o-que-vem-por-ai.html
          git commit -m "Adiciona página O que vem por aí"
          git push origin HEAD:main
