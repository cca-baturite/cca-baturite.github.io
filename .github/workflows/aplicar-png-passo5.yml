name: Aplicar PNG original no passo 5

on:
  push:
    paths:
      - .github/workflows/aplicar-png-passo5.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar e aplicar o PNG original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          media="guias/assets/sei/media"
          html="guias/sei-cadastro-inicial.html"
          mkdir -p "$media" /tmp/passo5

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/5b2804eba9e0f1fe493c59d54870517afa7ef546" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/passo5/original.b64
          tr -d '\r\n ' < /tmp/passo5/original.b64 | base64 -d > "$media/suap-chamado-descricao.png"

          python3 - <<'PY'
from pathlib import Path
import hashlib, re, struct
png_path = Path('guias/assets/sei/media/suap-chamado-descricao.png')
b = png_path.read_bytes()
assert b[:8] == b'\x89PNG\r\n\x1a\n'
assert struct.unpack('>II', b[16:24]) == (873, 589)
assert hashlib.sha256(b).hexdigest() == 'e2e9d69096202be5af8d00032197b0725cfee0d07d092100681694695d100c67'

p = Path('guias/sei-cadastro-inicial.html')
s = p.read_text(encoding='utf-8')
s = s.replace('assets/sei/media/suap-chamado-descricao.svg', 'assets/sei/media/suap-chamado-descricao.png')
s = re.sub(
    r'(<img[^>]*src="assets/sei/media/suap-chamado-descricao\.png"[^>]*?)width="\d+" height="\d+"',
    r'\1width="873" height="589"',
    s,
)
p.write_text(s, encoding='utf-8')
PY

      - name: Validar e publicar
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
import hashlib, struct
png = Path('guias/assets/sei/media/suap-chamado-descricao.png').read_bytes()
assert png[:8] == b'\x89PNG\r\n\x1a\n'
assert struct.unpack('>II', png[16:24]) == (873, 589)
assert hashlib.sha256(png).hexdigest() == 'e2e9d69096202be5af8d00032197b0725cfee0d07d092100681694695d100c67'
html = Path('guias/sei-cadastro-inicial.html').read_text(encoding='utf-8')
assert html.count('assets/sei/media/suap-chamado-descricao.png') == 2
assert 'assets/sei/media/suap-chamado-descricao.svg' not in html
assert 'width="873" height="589"' in html
PY
          rm -f guias/assets/sei/media/suap-chamado-descricao.svg
          rm -f guias/assets/sei/media/.passo5.b64.part0
          rm -f guias/assets/sei/media/.passo5.b64.part1
          rm -f .github/workflows/aplicar-png-passo5.yml
          rm -f .github/workflows/aplicar-imagens-originais-sei.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Substitui imagem do passo 5 pelo PNG original"
          git push origin HEAD:main
