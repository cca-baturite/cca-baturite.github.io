name: Ajuste temporário da busca do cadastro no SEI

on:
  push:
    branches:
      - ajusta-busca-cadastro-sei
    paths:
      - .github/workflows/ajusta-busca-cadastro-sei.yml

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o ramo
        uses: actions/checkout@v4
        with:
          ref: ajusta-busca-cadastro-sei
          fetch-depth: 0

      - name: Acrescentar termos ao cadastro inicial
        shell: python
        run: |
          from pathlib import Path
          import json

          caminho = Path("guias/assets/busca.json")
          dados = json.loads(caminho.read_text(encoding="utf-8"))
          entrada = next(item for item in dados if item["t"] == "Cadastro inicial no SEI")
          adicionais = "abrir processo peticionar peticionamento antes protocolar protocolo".split()
          palavras = entrada["k"].split()
          for palavra in adicionais:
              if palavra not in palavras:
                  palavras.append(palavra)
          entrada["k"] = " ".join(palavras)

          assert len(dados) == 72
          assert all(set(item) == {"t", "u", "s", "d", "k"} for item in dados)
          caminho.write_text(json.dumps(dados, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Remover o fluxo temporário e publicar o ajuste no ramo
        run: |
          git config user.name "cca-bat"
          git config user.email "cca-bat@users.noreply.github.com"
          git rm .github/workflows/ajusta-busca-cadastro-sei.yml
          git add guias/assets/busca.json
          git commit -m "Inclui cadastro inicial na busca por abertura de processo"
          git push origin HEAD:ajusta-busca-cadastro-sei
