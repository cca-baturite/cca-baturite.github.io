name: Corrige consultas dos chips de documentos

on:
  push:
    branches:
      - adiciona-chips-documentos
    paths:
      - .github/workflows/corrige-consultas-chips.yml

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o ramo
        uses: actions/checkout@v4
        with:
          ref: adiciona-chips-documentos
          fetch-depth: 0

      - name: Ajustar as consultas internas
        shell: python
        run: |
          from pathlib import Path

          caminho = Path("guias/index.html")
          html = caminho.read_text(encoding="utf-8")

          antigo_q = 'data-q="emitir documentos q academico"'
          novo_q = 'data-q="emitir documentos no Q-Acadêmico"'
          antigo_suap = 'data-q="emitir documentos suapedu"'
          novo_suap = 'data-q="emitir documentos no SuapEdu"'

          assert html.count(antigo_q) == 1
          assert html.count(antigo_suap) == 1
          html = html.replace(antigo_q, novo_q, 1).replace(antigo_suap, novo_suap, 1)
          assert html.count(novo_q) == 1
          assert html.count(novo_suap) == 1
          assert html.count('class="chip"') == 8

          caminho.write_text(html, encoding="utf-8")

      - name: Remover o fluxo temporário e publicar a correção no ramo
        run: |
          git config user.name "cca-bat"
          git config user.email "cca-bat@users.noreply.github.com"
          git rm .github/workflows/corrige-consultas-chips.yml
          git add guias/index.html
          git commit -m "Corrige consultas internas dos chips de documentos"
          git push origin HEAD:adiciona-chips-documentos
