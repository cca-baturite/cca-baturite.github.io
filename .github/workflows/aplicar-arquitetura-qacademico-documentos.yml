name: Aplicar arquitetura de documentos do Q-Acadêmico

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.event.issue.title == 'Aplicar arquitetura Q-Acadêmico documentos 2026-08-02'
    runs-on: ubuntu-latest
    steps:
      - name: Obter ramo de trabalho
        uses: actions/checkout@v4
        with:
          ref: qacademico-documentos-2026-08-02
          fetch-depth: 0

      - name: Restaurar páginas-base e aplicar alterações cirúrgicas
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- guias/index.html guias/q-academico.html guias/assets/busca.json
          python - <<'PY'
          from pathlib import Path
          import json

          # Página inicial: mantém integralmente a versão publicada e ativa somente a nova área.
          p = Path('guias/index.html')
          s = p.read_text(encoding='utf-8')
          old_disabled = '<span aria-disabled="true" class="button button-unavailable">Solicitar documentos <span class="availability-note">Em breve</span></span>'
          new_link = '<a class="button button-secondary" href="q-academico-documentos.html">Emitir documentos</a>'
          assert old_disabled in s, 'Botão desativado não localizado na página inicial.'
          s = s.replace(old_disabled, new_link, 1)
          s = s.replace('Acesso, senha e orientações para estudantes que permanecem vinculados ao Q-Acadêmico.', 'Acesso, senha e emissão de documentos para estudantes e egressos vinculados ao Q-Acadêmico.', 1)
          start = s.index('<article class="system-card"><span class="badge">Guias disponíveis</span><h2>Q-Acadêmico</h2>')
          end = s.index('</article>', start)
          preview = '<details class="q-documents-preview"><summary>Ver documentos disponíveis</summary><p>Declarações de matrícula e conclusão, Certidão de Conclusão, boletim, histórico parcial e horário. As opções variam conforme a situação acadêmica.</p></details>'
          s = s[:end] + preview + s[end:]
          css = '''<style id="cca-qacademico-documentos-home">
          .q-documents-preview{margin-top:1rem;border:1px solid var(--line);border-radius:12px;background:var(--green-050);padding:.72rem .9rem}
          .q-documents-preview summary{cursor:pointer;font-weight:800;color:var(--green-900)}
          .q-documents-preview p{margin:.65rem 0 .1rem;color:var(--muted)}
          </style>'''
          marker = '<style id="cca-focus-visible">'
          assert marker in s, 'Ponto de inserção do CSS não localizado.'
          s = s.replace(marker, css + marker, 1)
          s = s.replace('<time datetime="2026-07-30">30 de julho de 2026</time>', '<time datetime="2026-08-02">2 de agosto de 2026</time>', 1)
          p.write_text(s, encoding='utf-8')

          # Hub do Q-Acadêmico: preserva a página e incorpora documentos para ALUNO e EGRESSO.
          p = Path('guias/q-academico.html')
          s = p.read_text(encoding='utf-8')
          assert old_disabled in s, 'Botão desativado não localizado no hub do Q-Acadêmico.'
          s = s.replace(old_disabled, '<a class="button button-secondary" href="q-academico-documentos.html">Emitir documentos</a>', 1)
          s = s.replace('Q-Acadêmico · Perfil Aluno', 'Q-Acadêmico · Perfis Aluno e Egresso', 1)
          s = s.replace('Orientações para acesso e para as consultas acadêmicas dos estudantes que permanecem vinculados ao Q-Acadêmico.', 'Orientações para acesso, consultas e emissão de documentos de estudantes e egressos que permanecem vinculados ao Q-Acadêmico.', 1)
          s = s.replace('Use matrícula e senha do perfil Aluno.', 'Use matrícula e senha no perfil adequado: Aluno ou Egresso.', 1)
          s = s.replace('<strong>Consulte a orientação</strong><span>Novos guias serão organizados nesta área.</span>', '<strong>Emita seus documentos</strong><span>Escolha a situação acadêmica e gere o PDF no próprio sistema.</span>', 1)
          old_card = '<h3>Consultas no Q-Acadêmico</h3><p>Esta área receberá novas orientações sobre as funções acadêmicas que continuam disponíveis para os estudantes vinculados ao sistema.</p><div class="future-guide">Novos guias serão acrescentados gradualmente.</div>'
          new_card = '<h3>Emitir documentos acadêmicos</h3><p>Gere declarações, certidões, boletim, histórico parcial e horário, conforme sua situação acadêmica.</p><a class="button hub-card-button" href="q-academico-documentos.html">Abrir guia de documentos</a>'
          assert old_card in s, 'Cartão de consultas não localizado.'
          s = s.replace(old_card, new_card, 1)
          s = s.replace('Os pedidos acadêmicos orientados pelo portal continuam sendo protocolados no SEI, conforme cada procedimento.', 'Os documentos automáticos são emitidos no Q-Acadêmico. Pedidos que dependem de protocolo e análise continuam sendo realizados pelo SEI.', 1)
          section_start = s.index('<section class="article-section" id="comece">')
          section_end = s.index('</section>', section_start)
          auth = '<div class="callout-success"><strong>Documento pronto para uso.</strong> Os PDFs emitidos pelo Q-Acadêmico já possuem <strong>assinatura ou autenticação eletrônica</strong>, com chave ou link para conferência. Não é necessário ir à CCA, pedir carimbo ou assinatura, nem solicitar outra via por e-mail. A exceção indicada no guia é o histórico do egresso de curso superior, que não é gerado pelo sistema.</div>'
          s = s[:section_end] + auth + s[section_end:]
          s = s.replace('Continuam consultando no Q-Acadêmico as informações acadêmicas disponibilizadas para seu vínculo.', 'Continuam consultando informações e emitindo os documentos acadêmicos disponibilizados para seu vínculo.', 1)
          old_list = '<ul class="check-list"><li><strong>Acesso ou senha do Q-Acadêmico:</strong> use o guia específico desta área.</li><li><strong>Consultas de estudantes matriculados no SuapEdu:</strong> siga a área SuapEdu.</li><li><strong>Solicitações acadêmicas:</strong> consulte a área do SEI e o catálogo de procedimentos.</li></ul>'
          new_list = '<ul class="check-list"><li><strong>Acesso ou senha do Q-Acadêmico:</strong> use o guia específico desta área.</li><li><strong>Declarações, certidões, boletim, histórico parcial e horário:</strong> consulte o guia de documentos e emita o PDF no próprio Q-Acadêmico.</li><li><strong>Consultas de estudantes matriculados no SuapEdu:</strong> siga a área SuapEdu.</li><li><strong>Pedidos sujeitos a análise:</strong> consulte a área do SEI e o catálogo de procedimentos.</li></ul>'
          assert old_list in s, 'Lista de encaminhamentos não localizada.'
          s = s.replace(old_list, new_list, 1)
          p.write_text(s, encoding='utf-8')

          # Busca interna: inclui os novos guias e corrige o direcionamento da certidão.
          p = Path('guias/assets/busca.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          urls = {
              'q-academico-documentos.html', 'q-academico-documentos-aluno.html',
              'q-academico-aguardando-colacao.html', 'q-academico-egresso-superior.html',
              'q-academico-egresso-tecnico.html', 'q-academico-especializacao.html'
          }
          data = [x for x in data if x.get('u') not in urls and x.get('t') != 'Certidão de Conclusão de Curso']
          novos = [
            {'t':'Emitir documentos no Q-Acadêmico','u':'q-academico-documentos.html','s':'Q-Acadêmico','d':'Declarações, certidões, boletim, histórico parcial e horário, conforme a situação acadêmica.','k':'documentos emitir emissao declaração declaracao certidao histórico historico boletim horário horario assinatura autenticação autenticacao carimbo cca email'},
            {'t':'Documentos para matrícula ativa ou trancada','u':'q-academico-documentos-aluno.html','s':'Q-Acadêmico','d':'Documentos para estudante matriculado ou com matrícula trancada.','k':'matriculado ativa trancada trancamento declaração matricula histórico boletim horário'},
            {'t':'Declaração de conclusão — aguardando colação','u':'q-academico-aguardando-colacao.html','s':'Q-Acadêmico','d':'Comprovar a conclusão antes da colação de grau.','k':'aguardando colacao colação grau conclusão concluinte declaração'},
            {'t':'Documentos para egresso de curso superior','u':'q-academico-egresso-superior.html','s':'Q-Acadêmico','d':'Certidão no sistema e orientação específica para solicitar o histórico.','k':'egresso superior graduação graduacao certidão certidao conclusão histórico diploma colação'},
            {'t':'Documentos para egresso de curso técnico','u':'q-academico-egresso-tecnico.html','s':'Q-Acadêmico','d':'Certidão, histórico parcial, boletim e horário.','k':'egresso tecnico técnico subsequente certidão conclusão histórico diploma'},
            {'t':'Documentos da especialização lato sensu','u':'q-academico-especializacao.html','s':'Q-Acadêmico','d':'Documentos para aluno e egresso de especialização.','k':'especialização especializacao lato sensu pós pos graduação certificado certidão declaração matrícula'},
            {'t':'Certidão de Conclusão de Curso','u':'q-academico-documentos.html#egresso','s':'Q-Acadêmico','d':'Emitida diretamente no módulo EGRESSO, conforme o tipo de curso concluído.','k':'certidao conclusao curso formado formada egresso diploma certificado provisório provisorio autenticação eletrônica'}
          ]
          p.write_text(json.dumps(novos + data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validar referências principais
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'q-academico-documentos.html' guias/index.html
          grep -q 'assinatura ou autenticação eletrônica' guias/q-academico.html
          python -m json.tool guias/assets/busca.json >/dev/null

      - name: Registrar alterações no ramo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guias/index.html guias/q-academico.html guias/assets/busca.json
          git commit -m 'Integra documentos do Q-Acadêmico às páginas existentes'
          git push origin HEAD:qacademico-documentos-2026-08-02
