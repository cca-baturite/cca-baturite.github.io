name: Simplifica o ícone do Q-Acadêmico

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.event.issue.title == '[interno] simplificar icone Q-Academico'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o ramo principal
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remover a beca do ícone
        shell: python
        run: |
          from pathlib import Path

          caminho = Path('guias/index.html')
          html = caminho.read_text(encoding='utf-8')

          antigo = '<span class="system-mark system-mark-q" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M31 14c-10.5 0-19 8.5-19 19s8.5 19 19 19c3.1 0 6-.7 8.6-2.1l4.6 4.6c1.1 1.1 2.9 1.1 4 0s1.1-2.9 0-4l-4.2-4.2c3.5-3.5 5.6-8.3 5.6-13.3 0-10.5-8.5-19-19-19Zm0 6c7.2 0 13 5.8 13 13s-5.8 13-13 13-13-5.8-13-13 5.8-13 13-13Z" fill="currentColor"/><path d="M22 17 32 12l10 5-10 5-10-5Z" fill="#1f1f1f"/><path d="M26 20.5v4.2c0 1.8 2.7 3.8 6 3.8s6-2 6-3.8v-4.2" stroke="#1f1f1f" stroke-width="1.7" stroke-linecap="round"/></svg></span>'
          novo = '<span class="system-mark system-mark-q" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><circle cx="29" cy="29" r="15" stroke="currentColor" stroke-width="7"/><path d="M39.5 39.5 49 49" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></span>'

          assert html.count(antigo) == 1
          html = html.replace(antigo, novo, 1)
          caminho.write_text(html, encoding='utf-8')

      - name: Publicar a alteração e remover o fluxo temporário
        run: |
          git config user.name "cca-bat"
          git config user.email "cca-bat@users.noreply.github.com"
          git rm .github/workflows/ajusta-q-card.yml
          git add guias/index.html
          git commit -m "Simplifica o ícone do Q-Acadêmico"
          git push origin HEAD:main
