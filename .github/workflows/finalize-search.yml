name: Finalizar ajustes da busca

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-search.yml

permissions:
  contents: write

concurrency:
  group: finalizar-busca-cca
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
