name: Atualizar selo de versão e data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-version-date.yml

permissions:
  contents: write

concurrency:
  group: atualizar-versao-data
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a árvore atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar e validar a página inicial
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('guias/index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '.version-badge{display:inline-flex;align-items:center;padding:.3rem .65rem;border-radius:999px;background:#e8f3ec;color:#12452f;border:1px solid #b9d5c3;font-size:.82rem;font-weight:850;white-space:nowrap}'
          new_css = '.version-badge{display:inline-flex;align-items:center;padding:.3rem .65rem;border-radius:999px;background:#eaf3fb;color:#124c7a;border:1px solid #b7d2e8;font-size:.82rem;font-weight:850;white-space:nowrap}\n.version-updated{margin:0 0 .8rem;color:var(--muted);font-size:.88rem;font-weight:650}'
          assert text.count(old_css) == 1, 'Regra atual do selo não encontrada de forma única'
          text = text.replace(old_css, new_css, 1)

          old_html = '<div class="hero-title-line"><h1>Guias da CCA - IFCE Baturité</h1><span class="version-badge">Versão 1.0</span></div><p class="lead">'
          new_html = '<div class="hero-title-line"><h1>Guias da CCA - IFCE Baturité</h1><span class="version-badge">Versão 1.0</span></div><p class="version-updated">Última atualização: <time datetime="2026-07-30">30 de julho de 2026</time>.</p><p class="lead">'
          assert text.count(old_html) == 1, 'Cabeçalho da versão não encontrado de forma única'
          text = text.replace(old_html, new_html, 1)

          assert text.count('class="version-badge"') == 1
          assert text.count('class="version-updated"') == 1
          assert text.count('datetime="2026-07-30"') == 1
          assert '#eaf3fb' in text and '#124c7a' in text and '#b7d2e8' in text

          path.write_text(text, encoding='utf-8')
          print('OK: selo azul e data de atualização inseridos')
          PY

      - name: Publicar alteração limpa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-version-date.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          echo "$changed" | grep -qx 'guias/index.html'
          test -z "$(echo "$changed" | grep -Ev '^(guias/index.html|\.github/workflows/update-version-date.yml)$')"
          git commit -m "Atualiza selo de versão e data da página inicial"
          git push origin HEAD:main
