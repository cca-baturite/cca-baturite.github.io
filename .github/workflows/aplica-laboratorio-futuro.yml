name: Aplica laboratório do futuro

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aplica-laboratorio-futuro.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar identidade visual e navegação
        shell: python
        run: |
          from pathlib import Path
          import re

          raiz = Path("guias")
          index = raiz / "index.html"
          pagina = raiz / "o-que-vem-por-ai.html"

          html_index = index.read_text(encoding="utf-8")

          estilo_card = '''<style id="cca-laboratorio-home">
          .system-card-lab{position:relative;overflow:hidden;background:linear-gradient(160deg,#fff 0%,#f8f5ff 58%,#eef8f7 100%);border-color:#d7cdf4}
          .system-card-lab::before{content:"";position:absolute;right:-44px;top:-44px;width:145px;height:145px;border-radius:50%;background:radial-gradient(circle,rgba(109,85,199,.22),rgba(109,85,199,0) 70%);pointer-events:none}
          .system-card-lab::after{content:"";position:absolute;right:26px;bottom:24px;width:68px;height:42px;background-image:radial-gradient(rgba(27,143,138,.25) 1.4px,transparent 1.4px);background-size:11px 11px;opacity:.7;pointer-events:none}
          .lab-card-top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;position:relative;z-index:1}
          .badge-lab{color:#573f91;background:#e9e2fb}
          .lab-card-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#ede7ff,#def3f0);color:#654fb5;box-shadow:0 8px 20px rgba(109,85,199,.14)}
          .lab-card-icon svg{width:29px;height:29px}
          .system-card-lab h2{color:#25304a;position:relative;z-index:1}
          .system-card-lab p{color:#49556a;position:relative;z-index:1}
          .button-lab{color:#fff;background:#6d55c7;position:relative;z-index:1}
          .button-lab:hover{background:#513ca0}
          </style>'''

          if 'id="cca-laboratorio-home"' not in html_index:
              html_index = html_index.replace('</head>', estilo_card + '</head>', 1)

          card_antigo = '<article class="system-card"><span class="badge">Em breve</span><h2>O que vem por aí</h2><p>Novos guias, páginas específicas e ferramentas de apoio acadêmico estão em preparação.</p><div class="hero-actions"><a class="button button-primary" href="o-que-vem-por-ai.html">Ver novidades</a></div></article>'
          card_novo = '''<article class="system-card system-card-lab"><div class="lab-card-top"><span class="badge badge-lab">Em breve</span><span class="lab-card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v5l-4.2 7.3A3.8 3.8 0 0 0 9.1 21h5.8a3.8 3.8 0 0 0 3.3-5.7L14 8V3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.2 15h7.6M16.8 5.2l.8.8.8-.8M18.2 4.4v1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></div><h2>O que vem por aí</h2><p>Novos guias, páginas específicas, vídeos e ferramentas acadêmicas estão em preparação.</p><div class="hero-actions"><a class="button button-lab" href="o-que-vem-por-ai.html">Ver novidades</a></div></article>'''

          if card_antigo not in html_index and 'system-card system-card-lab' not in html_index:
              raise SystemExit('Card original não localizado')
          html_index = html_index.replace(card_antigo, card_novo, 1)
          index.write_text(html_index, encoding="utf-8")

          nova_pagina = r'''<!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="utf-8"/><meta name="color-scheme" content="only light"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="Próximos guias, páginas específicas, vídeos e ferramentas previstos para o Portal de Guias da CCA." name="description"/><title>O que vem por aí | Guias da CCA</title><link as="font" crossorigin href="assets/fonts/InterVariable.woff2" rel="preload" type="font/woff2"/><link href="assets/brand/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/><link href="assets/brand/favicon-192.png" rel="icon" sizes="192x192" type="image/png"/><link href="assets/brand/apple-touch-icon.png" rel="apple-touch-icon"/><meta property="og:type" content="website"/><meta property="og:locale" content="pt_BR"/><meta property="og:site_name" content="Guias da CCA | IFCE Campus Baturité"/><meta property="og:title" content="O que vem por aí | Guias da CCA"/><meta property="og:description" content="Próximos guias, páginas específicas, vídeos e ferramentas previstos para o Portal de Guias da CCA."/><meta property="og:url" content="https://cca-baturite.github.io/guias/o-que-vem-por-ai.html"/><meta property="og:image" content="https://cca-baturite.github.io/guias/assets/brand/og-image.png"/><meta name="twitter:card" content="summary_large_image"/>
          <style>
          @font-face{font-family:Inter;src:url("assets/fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
          :root{--green-950:#0b3424;--green-900:#12452f;--green-700:#1f6b45;--green-100:#e8f3ec;--blue-700:#0b63a8;--ink:#202a25;--muted:#59646e;--line:#d8e0db;--surface:#fff;--page:#f6f7f9;--shadow:0 12px 30px rgba(28,35,66,.10);--radius:18px;--lab-night:#18233f;--lab-violet:#6d55c7;--lab-violet-dark:#513ca0;--lab-violet-soft:#eee9fc;--lab-teal:#1b8f8a;--lab-teal-soft:#e5f5f3;--lab-lime:#b8e04a;--lab-lime-soft:#f2f8db;--lab-blue:#376ea6;--lab-blue-soft:#eaf2fb}
          *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:linear-gradient(180deg,#f7f8fa,#f4f2fb 62%,#f4f8f7);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;line-height:1.62}a{color:var(--blue-700);text-underline-offset:.18em}a:hover{text-decoration-thickness:2px}.skip-link{position:absolute;left:1rem;top:-5rem;z-index:999;background:#fff;color:var(--green-900);padding:.7rem 1rem;border-radius:8px;box-shadow:var(--shadow)}.skip-link:focus{top:1rem}.site-header{background:linear-gradient(135deg,var(--green-950),var(--green-700));color:#fff;border-bottom:5px solid #7ebc8d}.header-inner,.page-shell,.footer-inner{width:min(1160px,calc(100% - 2rem));margin-inline:auto}.header-inner{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:1.5rem}.brand{display:flex;gap:.9rem;align-items:center;color:#fff;text-decoration:none}.brand-mark{width:44px;height:44px;border-radius:12px;background:#fff;padding:6px}.brand strong{display:block;font-size:1.05rem;line-height:1.15}.brand span{display:block;font-size:.8rem;opacity:.86}.site-nav{display:flex;gap:.4rem;flex-wrap:wrap}.site-nav a{color:#fff;text-decoration:none;padding:.45rem .7rem;border-radius:8px}.site-nav a:hover,.site-nav a[aria-current]{background:rgba(255,255,255,.14)}.breadcrumb{margin:1.1rem 0 .5rem;color:var(--muted);font-size:.92rem}.breadcrumb ol{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.4rem}.breadcrumb li+li::before{content:"/";margin-right:.4rem;color:#8a9790}
          .lab-hero{position:relative;overflow:hidden;margin:1rem 0 1.7rem;padding:clamp(1.7rem,4vw,3rem);border-radius:24px;color:#fff;background:radial-gradient(circle at 88% 16%,rgba(184,224,74,.23),transparent 20%),radial-gradient(circle at 10% 90%,rgba(27,143,138,.24),transparent 26%),linear-gradient(135deg,var(--lab-night),#26375f 48%,var(--lab-violet));box-shadow:0 20px 48px rgba(31,36,78,.22)}.lab-hero::before{content:"";position:absolute;right:-42px;top:-70px;width:245px;height:245px;border-radius:50%;border:1px solid rgba(255,255,255,.22);box-shadow:0 0 0 34px rgba(255,255,255,.035),0 0 0 68px rgba(255,255,255,.025)}.lab-hero::after{content:"";position:absolute;left:44px;bottom:18px;width:150px;height:72px;background-image:radial-gradient(rgba(255,255,255,.26) 1.4px,transparent 1.4px);background-size:14px 14px;opacity:.45}.lab-hero>*{position:relative;z-index:1}.lab-pill{display:inline-flex;align-items:center;gap:.45rem;padding:.38rem .72rem;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:.82rem;font-weight:800}.lab-pill svg{width:17px;height:17px}.lab-hero h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.08;margin:.65rem 0 .8rem;color:#fff}.lab-hero .lead{max-width:850px;color:rgba(255,255,255,.91);font-size:1.12rem}.hero-actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.25rem}.button{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.78rem 1rem;border-radius:10px;font-weight:780;text-decoration:none;border:2px solid transparent}.button-primary{color:#fff;background:var(--lab-violet)}.button-primary:hover{background:var(--lab-violet-dark)}.button-secondary{color:#fff;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.38)}.button-secondary:hover{background:rgba(255,255,255,.15)}
          .content-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:2rem;align-items:start;padding-bottom:4rem}.article-section{scroll-margin-top:1rem;margin-bottom:1.25rem;padding:clamp(1.2rem,2.5vw,1.8rem);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid rgba(197,200,222,.75);border-radius:var(--radius);box-shadow:0 8px 22px rgba(38,43,80,.065)}.section-kicker{display:flex;align-items:center;gap:.55rem;margin:0 0 .35rem;color:var(--lab-violet-dark);font-size:.84rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.section-kicker svg{width:19px;height:19px}.article-section h2{color:#25304a;line-height:1.18;font-size:clamp(1.45rem,3vw,2rem);margin:0 0 .95rem}.lab-note{display:flex;gap:.8rem;align-items:flex-start;padding:1rem 1.05rem;border-radius:14px;background:linear-gradient(135deg,#eef0ff,#e9f7f5);border-left:5px solid var(--lab-teal)}.lab-note-icon{width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;border-radius:12px;background:#fff;color:var(--lab-teal);box-shadow:0 6px 16px rgba(27,143,138,.12)}.lab-note-icon svg{width:22px;height:22px}.lab-note strong{display:block;color:#26354c;margin-bottom:.15rem}.lab-note p{margin:0;color:#4d5a66}
          .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.lab-card{position:relative;overflow:hidden;background:#fff;border:1px solid #ddd8ef;border-radius:16px;padding:1.2rem;box-shadow:0 7px 18px rgba(43,46,82,.055)}.lab-card::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:4px;background:linear-gradient(90deg,var(--lab-violet),var(--lab-teal))}.lab-card-top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:.65rem}.lab-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--lab-violet-soft);color:var(--lab-violet)}.lab-icon svg{width:26px;height:26px}.badge{display:inline-flex;padding:.25rem .55rem;border-radius:999px;color:#573f91;background:#ece6fb;font-size:.76rem;font-weight:850}.lab-card h3{color:#25304a;line-height:1.2;font-size:1.22rem;margin:.25rem 0 .55rem}.lab-card p{color:var(--muted);margin:.2rem 0 .8rem}.lab-card .hero-actions{margin-top:.9rem}.lab-card .button{font-size:.93rem}.lab-card .button-secondary{color:#573f91;background:#fff;border-color:#8a78c9}.lab-card.teal{border-color:#cce6e3}.lab-card.teal::before{background:linear-gradient(90deg,var(--lab-teal),var(--lab-lime))}.lab-card.teal .lab-icon{background:var(--lab-teal-soft);color:var(--lab-teal)}.lab-card.teal .badge{color:#17655f;background:#ddf2ef}.lab-card.lime{border-color:#dce8ad}.lab-card.lime::before{background:linear-gradient(90deg,var(--lab-lime),var(--lab-teal))}.lab-card.lime .lab-icon{background:var(--lab-lime-soft);color:#6b7c18}.lab-card.blue{border-color:#cddcef}.lab-card.blue::before{background:linear-gradient(90deg,var(--lab-blue),var(--lab-violet))}.lab-card.blue .lab-icon{background:var(--lab-blue-soft);color:var(--lab-blue)}
          .toc{position:sticky;top:1rem;padding:1rem;background:rgba(255,255,255,.9);border:1px solid #d9dbea;border-radius:var(--radius);box-shadow:0 7px 18px rgba(43,46,82,.055)}.toc h2{font-size:1rem;margin:0 0 .6rem;color:#26354c}.toc ol{margin:0;padding-left:1.15rem}.toc li{margin:.38rem 0;font-size:.92rem}.toc a{color:#435064;text-decoration:none}.toc a:hover{color:var(--lab-violet);text-decoration:underline}.site-footer{background:var(--green-950);color:#eaf4ee;padding:2rem 0}.footer-inner{display:flex;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}.site-footer a{color:#fff}.footer-credit{text-align:right}.small{font-size:.9rem}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}a:focus-visible,button:focus-visible{outline:3px solid #ffbf47;outline-offset:3px;box-shadow:0 0 0 1px #1f2933}
