          </style></head><body><a class="skip-link" href="#conteudo">Ir para o conteúdo</a><header class="site-header"><div class="header-inner"><a aria-label="Página inicial dos Guias da CCA" class="brand" href="index.html"><img alt="" class="brand-mark" height="44" src="assets/brand/favicon-192.png" width="44"/><span><strong>Guias da CCA</strong><span>IFCE Campus Baturité</span></span></a><nav aria-label="Navegação principal" class="site-nav"><a href="index.html">Início</a><a href="q-academico.html">Q-Acadêmico</a><a href="sei.html">SEI</a><a href="suapedu.html">SuapEdu</a><a aria-current="page" href="o-que-vem-por-ai.html">Em breve</a></nav></div></header><main class="page-shell" id="conteudo"><nav aria-label="Caminho da página" class="breadcrumb"><ol><li><a href="index.html">Guias</a></li><li aria-current="page">O que vem por aí</li></ol></nav><section class="lab-hero"><span class="lab-pill"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l1.2 3.7L17 8l-3.8 1.3L12 13l-1.2-3.7L7 8l3.8-1.3L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Laboratório do futuro</span><h1>O que vem por aí</h1><p class="lead">Uma vitrine temporária dos próximos guias, páginas específicas, vídeos e ferramentas que estão sendo preparados para ampliar o Portal de Guias da CCA.</p><div class="hero-actions"><a class="button button-primary" href="index.html">Voltar ao início</a><a class="button button-secondary" href="#paginas-especificas">Explorar novidades</a></div></section><div class="content-layout"><article><section class="article-section"><div class="lab-note"><span class="lab-note-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><div><strong>Página temporária</strong><p>À medida que cada conteúdo for publicado, ele será transferido para sua área definitiva no portal e deixará esta lista.</p></div></div></section><section class="article-section" id="paginas-especificas"><p class="section-kicker"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4h10l4 4v12H5V4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 4v5h5M8 13h8M8 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Páginas específicas em preparação</p><h2>Orientações mais diretas para cada procedimento</h2><div class="cards">
          <article class="lab-card blue"><div class="lab-card-top"><span class="lab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h9l3 3v15H6V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 3v4h4M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="badge">Enquanto isso</span></div><h3>Procedimentos específicos do SEI</h3><p>Páginas dedicadas para solicitações acadêmicas específicas. Por enquanto, use os guias gerais de abertura de processo.</p><div class="hero-actions"><a class="button button-primary" href="sei-abrir-solicitacao-celular.html">Guia pelo celular</a><a class="button button-secondary" href="sei-abrir-solicitacao-computador.html">Guia pelo computador</a></div></article>
          <article class="lab-card"><div class="lab-card-top"><span class="lab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-4 9 4-9 4-9-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 11v4c0 1.4 2.2 3 5 3s5-1.6 5-3v-4M21 10v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="badge">Em breve</span></div><h3>Colação de grau, diplomas e certificados</h3><p>Uma página específica para orientar as etapas de conclusão do curso e a emissão dos documentos correspondentes.</p></article>
          <article class="lab-card teal"><div class="lab-card-top"><span class="lab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8 7H4v4M4 11a8 8 0 1 0 2-5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="badge">Em breve</span></div><h3>Retorno ao curso</h3><p>Orientações específicas para estudantes com matrícula trancada ou em situação de abandono que desejam retomar o curso.</p></article>
          <article class="lab-card lime"><div class="lab-card-top"><span class="lab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="11" r="2" stroke="currentColor" stroke-width="1.7"/><path d="M5.8 16c.6-1.4 1.4-2 2.2-2s1.6.6 2.2 2M13 9h5M13 13h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span class="badge">Em breve</span></div><h3>Atualização de dados cadastrais no IFCE</h3><p>Orientações para conferir, corrigir ou atualizar informações pessoais e acadêmicas nos sistemas institucionais.</p></article>
          <article class="lab-card blue"><div class="lab-card-top"><span class="lab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 8.5 13.2 13l-4.7 2.5L11 11l4.5-2.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span><span class="badge">Em breve</span></div><h3>Quando procurar cada setor do Departamento de Ensino</h3><p>Um guia para diferenciar as atribuições da Coordenação de Curso, da CTP, da CAE e do próprio Departamento de Ensino.</p></article>
          </div></section><section class="article-section" id="ferramentas"><p class="section-kicker"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16v14H4V5Z" stroke="currentColor" stroke-width="1.7"/><path d="M4 10h16M9 5v14M14 10v9" stroke="currentColor" stroke-width="1.7"/></svg>Ferramentas de apoio acadêmico</p><h2>Recursos para compreender e planejar o percurso curricular</h2><div class="cards">
          <article class="lab-card teal"><div class="lab-card-top"><span class="lab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M9 4v16M15 9v11" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="badge">Em breve</span></div><h3>Como entender uma matriz curricular</h3><p>Uma explicação simples sobre períodos, códigos, carga horária, pré-requisitos, equivalências e situação da matriz.</p></article>
          <article class="lab-card lime"><div class="lab-card-top"><span class="lab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="5" stroke="currentColor" stroke-width="1.8"/><path d="m13 13 4 4M16 5h5v14h-5M18.5 8v3M17 9.5h3M17 15h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span class="badge">Em breve</span></div><h3>Busca inteligente e calculadora curricular</h3><p>Uma ferramenta para consultar disciplinas, pré-requisitos e equivalências e compreender melhor as possibilidades do percurso acadêmico.</p></article>
          </div></section><section class="article-section" id="videos"><p class="section-kicker"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="m10 9 5 3-5 3V9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Conteúdos em vídeo</p><h2>Guias em vídeo</h2><div class="lab-card"><div class="lab-card-top"><span class="lab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="m10 9 5 3-5 3V9Z" fill="currentColor"/></svg></span><span class="badge">Em breve</span></div><p>Orientações em vídeo serão adicionadas gradualmente para complementar os guias escritos.</p></div></section></article><aside aria-label="Nesta página" class="toc"><h2>Nesta página</h2><ol><li><a href="#paginas-especificas">Páginas específicas</a></li><li><a href="#ferramentas">Ferramentas de apoio acadêmico</a></li><li><a href="#videos">Guias em vídeo</a></li></ol></aside></div></main><footer class="site-footer"><div class="footer-inner"><div><strong>Coordenadoria de Controle Acadêmico — CCA</strong><br/>IFCE Campus Baturité · <a href="mailto:cca.baturite@ifce.edu.br">cca.baturite@ifce.edu.br</a></div><div class="footer-credit">Desenvolvido e mantido pela CCA.<br/><span class="small">Estatísticas de acesso são utilizadas para aprimorar o conteúdo.</span></div></div></footer><script data-goatcounter="https://cca-baturite.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body></html>'''
          pagina.write_text(nova_pagina, encoding="utf-8")

          padrao_nav = re.compile(r'<nav aria-label="Navegação principal" class="site-nav">.*?</nav>', re.S)
          for caminho in raiz.glob('*.html'):
              texto = caminho.read_text(encoding='utf-8')
              def ajustar(match):
                  nav = match.group(0)
                  if 'o-que-vem-por-ai.html' in nav:
                      return nav
                  link = '<a href="o-que-vem-por-ai.html">Em breve</a>'
                  return nav[:-6] + link + '</nav>'
              novo = padrao_nav.sub(ajustar, texto, count=1)
              caminho.write_text(novo, encoding='utf-8')

          assert 'system-card system-card-lab' in index.read_text(encoding='utf-8')
          assert 'Laboratório do futuro' in pagina.read_text(encoding='utf-8')
          assert 'aria-current="page" href="o-que-vem-por-ai.html"' in pagina.read_text(encoding='utf-8')

      - name: Publicar e remover o fluxo temporário
        run: |
          git config user.name "cca-bat"
          git config user.email "cca-bat@users.noreply.github.com"
          git rm .github/workflows/aplica-laboratorio-futuro.yml
          git add guias/*.html
          git commit -m "Aplica identidade laboratório do futuro"
          git push origin HEAD:main
