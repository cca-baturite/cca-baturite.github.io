<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="t d"><title id="t">Documentos para aluno de especialização lato sensu</title><desc id="d">Resumo visual dos documentos disponíveis e da declaração de matrícula com disciplinas.</desc><style>.bg{fill:#f7f8f6}.card{fill:#fff;stroke:#d3ddd7;stroke-width:2}.head{fill:#12452f}.soft{fill:#e8f3ec}.red{fill:none;stroke:#ef2b2d;stroke-width:7}.yellow{fill:#fff3d6;stroke:#c48722;stroke-width:2}.green{fill:#e9f7ed;stroke:#398651;stroke-width:2}.h{font:700 28px Arial,sans-serif;fill:#fff}.t{font:700 25px Arial,sans-serif;fill:#12452f}.b{font:22px Arial,sans-serif;fill:#202a25}.s{font:18px Arial,sans-serif;fill:#526159}.note{font:700 19px Arial,sans-serif;fill:#805412}.ok{font:700 20px Arial,sans-serif;fill:#23653a}</style><rect class="bg" width="1000" height="900"/><rect class="card" x="35" y="30" width="930" height="405" rx="18"/><rect class="head" x="35" y="30" width="930" height="72" rx="18"/><text class="h" x="70" y="76">1. Especialização em andamento — módulo ALUNO</text><rect class="soft" x="70" y="125" width="860" height="265" rx="12"/><text class="b" x="100" y="170">Boletim Escolar</text><text class="b" x="100" y="217">Declaração de Matrícula com Disciplina</text><text class="b" x="100" y="264">Declaração de Percentual de Conclusão</text><text class="b" x="100" y="311">Histórico Escolar Parcial para Simples Conferência</text><text class="b" x="100" y="358">Horário do Aluno — Vertical</text><rect class="red" x="82" y="184" width="500" height="48" rx="6"/><rect class="yellow" x="35" y="460" width="930" height="95" rx="14"/><text class="note" x="70" y="495">A Declaração de Matrícula padrão não é oferecida para a especialização.</text><text class="s" x="70" y="526">Use “Declaração de Matrícula com Disciplina” e selecione o período letivo.</text><rect class="card" x="35" y="580" width="930" height="190" rx="18"/><text class="t" x="70" y="630">2. PDF gerado</text><rect class="red" x="265" y="655" width="470" height="65"/><text class="t" x="322" y="697">DECLARAÇÃO DE MATRÍCULA</text><text class="b" x="100" y="755">O título do PDF é geral, mas o corpo relaciona as disciplinas da especialização.</text><rect class="green" x="35" y="795" width="930" height="75" rx="14"/><text class="ok" x="70" y="828">✓ Assinatura ou autenticação eletrônica incluída</text><text class="s" x="70" y="855">Não precisa ir à CCA, pedir carimbo ou solicitar uma nova via por e-mail.</text></svg>