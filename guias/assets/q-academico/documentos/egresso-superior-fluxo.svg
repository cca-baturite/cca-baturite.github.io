<text class="alert" x="70" y="852">Exceção: o histórico não é gerado para egresso de curso superior.</text>
<text class="s" x="70" y="883">Mesmo aparecendo na lista, solicite o histórico por e-mail à CCA.</text>
<text class="s" x="70" y="910">A Certidão funciona normalmente.</text>
<rect class="green" x="35" y="945" width="930" height="76" rx="14"/>
<text class="ok" x="70" y="978">✓ A Certidão já possui autenticação eletrônica.</text>
<text class="s" x="70" y="1008">Não envie e-mail para pedir assinatura, carimbo ou outra via.</text>
