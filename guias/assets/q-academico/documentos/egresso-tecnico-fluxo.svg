<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="t d"><title id="t">Documentos para egresso de curso técnico</title><desc id="d">Resumo visual da lista e da Certidão de Conclusão do curso técnico.</desc><style>.bg{fill:#f7f8f6}.card{fill:#fff;stroke:#d3ddd7;stroke-width:2}.head{fill:#12452f}.soft{fill:#e8f3ec}.red{fill:none;stroke:#ef2b2d;stroke-width:7}.blue{fill:#edf6fc;stroke:#0b63a8;stroke-width:2}.green{fill:#e9f7ed;stroke:#398651;stroke-width:2}.h{font:700 28px Arial,sans-serif;fill:#fff}.t{font:700 25px Arial,sans-serif;fill:#12452f}.b{font:22px Arial,sans-serif;fill:#202a25}.s{font:18px Arial,sans-serif;fill:#526159}.note{font:700 19px Arial,sans-serif;fill:#124c7a}.ok{font:700 20px Arial,sans-serif;fill:#23653a}</style><rect class="bg" width="1000" height="790"/><rect class="card" x="35" y="30" width="930" height="360" rx="18"/><rect class="head" x="35" y="30" width="930" height="72" rx="18"/><text class="h" x="70" y="76">1. Módulo EGRESSO — curso técnico subsequente</text><rect class="soft" x="70" y="125" width="860" height="220" rx="12"/><text class="b" x="100" y="170">Boletim Escolar</text><text class="b" x="100" y="217">Certidão de Conclusão de Curso Técnico</text><text class="b" x="100" y="264">Histórico Escolar Parcial para Simples Conferência</text><text class="b" x="100" y="311">Horário do Aluno — Vertical</text><rect class="red" x="82" y="184" width="510" height="48" rx="6"/><rect class="card" x="35" y="420" width="930" height="185" rx="18"/><text class="t" x="70" y="470">2. PDF gerado</text><rect class="red" x="250" y="498" width="500" height="65"/><text class="t" x="301" y="540">CERTIDÃO DE CONCLUSÃO DE CURSO</text><rect class="blue" x="35" y="630" width="930" height="70" rx="14"/><text class="note" x="70" y="661">Na tela: “Curso Técnico”. No PDF: “Certidão de Conclusão de Curso”.</text><text class="s" x="70" y="687">A diferença de título é esperada; confira o curso e os dados pessoais.</text><rect class="green" x="35" y="718" width="930" height="52" rx="14"/><text class="ok" x="70" y="751">✓ Autenticação eletrônica incluída — sem carimbo, ida à CCA ou e-mail.</text></svg>