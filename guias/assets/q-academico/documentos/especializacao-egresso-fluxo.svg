<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="t d"><title id="t">Documentos para egresso de especialização lato sensu</title><desc id="d">Resumo visual dos documentos disponíveis, do erro de nomenclatura e da Certidão de Conclusão.</desc><style>.bg{fill:#f7f8f6}.card{fill:#fff;stroke:#d3ddd7;stroke-width:2}.head{fill:#12452f}.soft{fill:#e8f3ec}.red{fill:none;stroke:#ef2b2d;stroke-width:7}.danger{fill:#fff1f0;stroke:#b42318;stroke-width:2}.green{fill:#e9f7ed;stroke:#398651;stroke-width:2}.blue{fill:#edf6fc;stroke:#0b63a8;stroke-width:2}.h{font:700 28px Arial,sans-serif;fill:#fff}.t{font:700 25px Arial,sans-serif;fill:#12452f}.b{font:22px Arial,sans-serif;fill:#202a25}.s{font:18px Arial,sans-serif;fill:#526159}.alert{font:700 19px Arial,sans-serif;fill:#b42318}.ok{font:700 20px Arial,sans-serif;fill:#23653a}.note{font:700 19px Arial,sans-serif;fill:#124c7a}</style><rect class="bg" width="1000" height="930"/><rect class="card" x="35" y="30" width="930" height="360" rx="18"/><rect class="head" x="35" y="30" width="930" height="72" rx="18"/><text class="h" x="70" y="76">1. Especialização concluída — módulo EGRESSO</text><rect class="soft" x="70" y="125" width="860" height="220" rx="12"/><text class="b" x="100" y="170">Boletim Escolar</text><text class="b" x="100" y="217">Certidão de Conclusão de Curso Técnico</text><text class="b" x="100" y="264">Histórico Escolar Parcial para Simples Conferência</text><text class="b" x="100" y="311">Horário do Aluno — Vertical</text><rect class="red" x="82" y="184" width="510" height="48" rx="6"/><rect class="danger" x="35" y="415" width="930" height="105" rx="14"/><text class="alert" x="70" y="452">Erro do sistema: o menu chama a opção de “Curso Técnico”.</text><text class="s" x="70" y="484">Apesar do rótulo incorreto, essa opção gera a certidão da especialização. Confira o curso no PDF.</text><rect class="card" x="35" y="545" width="930" height="210" rx="18"/><text class="t" x="70" y="595">2. PDF gerado</text><rect class="red" x="250" y="620" width="500" height="65"/><text class="t" x="300" y="662">CERTIDÃO DE CONCLUSÃO DE CURSO</text><text class="b" x="100" y="720">O corpo do documento identifica corretamente a especialização lato sensu concluída.</text><rect class="blue" x="35" y="780" width="930" height="65" rx="14"/><text class="note" x="70" y="820">Documento definitivo da pós-graduação: Certificado Digital.</text><rect class="green" x="35" y="865" width="930" height="45" rx="14"/><text class="ok" x="70" y="895">✓ Autenticação eletrônica incluída — sem carimbo, ida à CCA ou e-mail.</text></svg>