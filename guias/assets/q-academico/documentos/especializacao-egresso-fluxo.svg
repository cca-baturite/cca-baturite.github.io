<style>
.bg{fill:#f8f7f3}.card{fill:#fff;stroke:#e1d8c7;stroke-width:2}.head{fill:#7a5d2a}.soft{fill:#fbf8ef}.selected{fill:#f2ead7;stroke:#8a6a2f;stroke-width:2}.titlebox{fill:#fffdf8;stroke:#e1d8c7;stroke-width:2}.danger{fill:#fff1f0;stroke:#b42318;stroke-width:2}.green{fill:#e9f7ed;stroke:#398651;stroke-width:2}.blue{fill:#edf6fc;stroke:#0b63a8;stroke-width:2}.h{font:700 28px Arial,sans-serif;fill:#fff}.t{font:700 25px Arial,sans-serif;fill:#5d4824}.docname{font:700 23px Arial,sans-serif;fill:#5d4824;text-anchor:middle}.b{font:22px Arial,sans-serif;fill:#2f2b22}.s{font:18px Arial,sans-serif;fill:#696257}.alert{font:700 19px Arial,sans-serif;fill:#b42318}.ok{font:700 20px Arial,sans-serif;fill:#23653a}.note{font:700 19px Arial,sans-serif;fill:#124c7a}
</style>
